<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <p class="eyebrow">Electron starter</p>
        <button type="button" class="ghost-btn" id="open-settings">Settings</button>
      </header>
      <h1>Hello from Electron-Demo</h1>
      <p class="lede">
        Tray icon, settings, and an update-check stub are wired up. Close the window to
        minimize to tray (toggle in Settings).
      </p>
      <dl class="versions" id="versions" aria-live="polite">
        <div>
          <dt>App</dt>
          <dd id="app-version">…</dd>
        </div>
        <div>
          <dt>Electron</dt>
          <dd id="electron-version">…</dd>
        </div>
        <div>
          <dt>Chrome</dt>
          <dd id="chrome-version">…</dd>
        </div>
        <div>
          <dt>Node</dt>
          <dd id="node-version">…</dd>
        </div>
        <div>
          <dt>Platform</dt>
          <dd id="platform">…</dd>
        </div>
        <div>
          <dt>Updates</dt>
          <dd id="update-status">…</dd>
        </div>
      </dl>
      <div class="actions">
        <button type="button" class="primary-btn" id="check-updates">Check for updates</button>
        <p class="hint" id="update-message"></p>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
